name: Markdown to PDF

on:
  push:
    branches: [main]
    paths: [markdown/**]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: markdown
          output_dir: pdf
          build_html: false
          table_of_contents: false

      - name: Commit PDFs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pdf/
          git diff --cached --quiet || git commit -m "Update PDFs [skip ci]"
          git push
